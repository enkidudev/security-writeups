name: Notify portfolio to rebuild

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.gif"
      - "**/*.svg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch portfolio rebuild
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "enkidudev",
              repo: "enkidudev.github.io",
              event_type: "writeups_updated",
              client_payload: {
                source_sha: context.sha,
                source_ref: context.ref
              }
            });
